name: Build Custom MeuDesk Client (macOS)

on:
  push:
    branches:
      - build-custom
  workflow_dispatch:

env:
  # macOS needs 1.81, not the 1.75 used by the Android and Windows workflows:
  # https://github.com/yury/cidre requires it.
  RUST_VERSION: "1.81"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  NASM_VERSION: "2.16.03"

jobs:
  build-macos:
    name: Build macOS Client (${{ matrix.job.arch }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              target: aarch64-apple-darwin,
              os: macos-14,
              arch: aarch64,
              min-macos: "12.3",
              extra-build-args: "--screencapturekit",
            }
          - {
              target: x86_64-apple-darwin,
              os: macos-15-intel,
              arch: x86_64,
              min-macos: "10.14",
              extra-build-args: "",
            }

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout do Código com Submódulos
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependências de build
        run: |
          brew install llvm create-dmg
          if ! command -v pkg-config &>/dev/null; then
            brew install pkg-config
          fi

      - name: Instalar NASM (Codecs de Vídeo)
        run: |
          # aom needs NASM 2.x; `brew install nasm` now ships 3.x, whose CLI is
          # incompatible.
          wget https://www.nasm.us/pub/nasm/releasebuilds/${{ env.NASM_VERSION }}/macosx/nasm-${{ env.NASM_VERSION }}-macosx.zip
          unzip nasm-${{ env.NASM_VERSION }}-macosx.zip
          sudo cp nasm-${{ env.NASM_VERSION }}/nasm /usr/local/bin/nasm
          nasm --version

      - name: Setup flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Workaround for flutter issue
        run: |
          cd "$(dirname "$(which flutter)")"
          # https://github.com/flutter/flutter/issues/133533
          sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart

      - name: Apply Customizations
        run: python3 scripts/apply_customizations.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.job.target }}
          components: "rustfmt"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ matrix.job.os }}

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        run: |
          if ! $VCPKG_ROOT/vcpkg \
            install \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Generate flutter-rust-bridge files
        run: |
          cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
          # Downgrade extended_text for Flutter 3.24.5 bridge generation compatibility
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter && flutter pub get && popd
          ~/.cargo/bin/flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --class-name MeuDesk \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          # Restore extended_text version after bridge generation
          git checkout flutter/pubspec.yaml

      - name: Compilar MeuDesk (build.py --flutter)
        run: |
          MIN_MACOS_VERSION="${{ matrix.job.min-macos }}"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

      - name: Gerar o .dmg (sem assinatura)
        run: |
          APP_NAME="$(sed -n 's/^PRODUCT_NAME = //p' flutter/macos/Runner/Configs/AppInfo.xcconfig)"
          APP_PATH="./flutter/build/macos/Build/Products/Release/${APP_NAME}.app"
          # Ad-hoc signature: without it macOS refuses to launch arm64 bundles
          # outright. It does not replace a Developer ID signature.
          codesign --force --deep --sign - "$APP_PATH"
          CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
          sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
          create-dmg \
            --icon "${APP_NAME}.app" 200 190 \
            --hide-extension "${APP_NAME}.app" \
            --window-size 800 400 \
            --app-drop-link 600 185 \
            "MeuDesk-${{ matrix.job.arch }}.dmg" \
            "$APP_PATH"

      - name: Empacotar e Disponibilizar o Arquivo .dmg
        uses: actions/upload-artifact@v4
        with:
          name: MeuDesk-macOS-${{ matrix.job.arch }}
          path: MeuDesk-${{ matrix.job.arch }}.dmg
          retention-days: 7
