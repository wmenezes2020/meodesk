name: Vendor Upstream Dependencies

# Removes the build's dependency on github.com/rustdesk-org, keeping everything
# inside this repository. Nothing is created anywhere else and no extra secret
# is needed: the default GITHUB_TOKEN can write to this repo.
#
# Runs on every push to build-custom and is idempotent: once the sources are
# vendored and the engine is mirrored, later runs finish in seconds.

on:
  push:
    branches:
      - build-custom
  workflow_dispatch:

permissions:
  contents: write

env:
  RUST_VERSION: "1.75"
  VENDOR_DIR: third_party/vendor
  ENGINE_RELEASE_TAG: engine-mirror
  ENGINE_ASSET: windows-x64-release.zip

jobs:
  vendor:
    name: Vendor upstream sources
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Verificar o que ainda falta
        id: todo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          vendor=true
          engine=true
          if [ -f .cargo/config.toml ] && [ -d "$VENDOR_DIR" ]; then
            vendor=false
          fi
          if gh release view "$ENGINE_RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            engine=false
          fi
          echo "vendor=$vendor" >> "$GITHUB_OUTPUT"
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          echo "Vendor pendente: $vendor | Engine pendente: $engine"

      # ---------------------------------------------------------------- vendor

      - name: Install Rust toolchain
        if: steps.todo.outputs.vendor == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Vendorizar as dependências git
        if: steps.todo.outputs.vendor == 'true'
        run: |
          set -euo pipefail
          # cargo vendor copies only the crates the lock actually uses, so a
          # large repository like wezterm contributes just portable-pty.
          # It emits the config on stdout; cargo writes the `directory` value
          # itself, so it is kept verbatim instead of being hand-built.
          cargo vendor "$VENDOR_DIR" > vendor-config.toml
          du -sh "$VENDOR_DIR"

      - name: Manter apenas as fontes git e montar o .cargo/config.toml
        if: steps.todo.outputs.vendor == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil

          vendor_dir = os.environ["VENDOR_DIR"]

          # Vendored crates from crates.io carry a package checksum; git ones
          # have "package": null. Only the git sources are replaced, so the
          # registry crates are dropped and keep coming from crates.io.
          removed = kept = 0
          for name in sorted(os.listdir(vendor_dir)):
              checksum = os.path.join(vendor_dir, name, ".cargo-checksum.json")
              if not os.path.isfile(checksum):
                  continue
              with open(checksum, encoding="utf-8") as fh:
                  if json.load(fh).get("package") is None:
                      kept += 1
                  else:
                      shutil.rmtree(os.path.join(vendor_dir, name))
                      removed += 1
          print(f"mantidos (git): {kept} | removidos (crates.io): {removed}")

          # Same filtering on the config: drop the crates-io replacement, keep
          # every git source and the vendored-sources directory.
          with open("vendor-config.toml", encoding="utf-8") as fh:
              blocks, current = [], []
              for line in fh:
                  if line.startswith("[") and current:
                      blocks.append(current)
                      current = []
                  current.append(line)
              if current:
                  blocks.append(current)

          keep = [b for b in blocks if not b[0].startswith("[source.crates-io]")]
          os.makedirs(".cargo", exist_ok=True)
          with open(".cargo/config.toml", "w", encoding="utf-8", newline="\n") as fh:
              fh.write(
                  "# Generated by .github/workflows/vendor-upstream-deps.yml.\n"
                  "# Redirects the upstream git dependencies to the sources\n"
                  "# vendored in this repository. crates.io is untouched.\n\n"
              )
              fh.writelines("".join(b) for b in keep)
          PY

      - name: Conferir que toda fonte git do Cargo.lock foi vendorizada
        if: steps.todo.outputs.vendor == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          import sys

          vendor_dir = os.environ["VENDOR_DIR"]
          text = open("Cargo.lock", encoding="utf-8").read()

          # [[package]] blocks that resolve to a git source must have a
          # matching vendored directory, otherwise the build would silently
          # fall back to the network.
          missing = []
          for block in text.split("[[package]]"):
              name = re.search(r'^name = "(.+?)"', block, re.M)
              source = re.search(r'^source = "git\+(.+?)"', block, re.M)
              if not name or not source:
                  continue
              if not os.path.isdir(os.path.join(vendor_dir, name.group(1))):
                  missing.append(f"{name.group(1)}  <-  {source.group(1)}")

          if missing:
              print("::error::fontes git sem diretório vendorizado:")
              for item in missing:
                  print("  " + item)
              sys.exit(1)
          print("Todas as fontes git do Cargo.lock estão vendorizadas.")
          PY

      # ---------------------------------------------------------------- engine

      - name: Espelhar a engine Flutter customizada
        if: steps.todo.outputs.engine == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Release assets live in this repository, so the Windows build stops
          # downloading from github.com/rustdesk/engine.
          curl -fL -o "$ENGINE_ASSET" \
            "https://github.com/rustdesk/engine/releases/download/main/$ENGINE_ASSET"
          gh release create "$ENGINE_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Flutter engine (mirror)" \
            --notes "Cópia do artefato de engine usado pelo build Windows." \
            "$ENGINE_ASSET"

      # ---------------------------------------------------------------- commit

      - name: Commitar as fontes vendorizadas
        if: steps.todo.outputs.vendor == 'true'
        run: |
          set -euo pipefail
          rm -f vendor-config.toml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # -f: the repository-wide *png / *svg rules would drop test fixtures
          # shipped inside some crates.
          git add -f .cargo/config.toml "$VENDOR_DIR"
          if git diff --cached --quiet; then
            echo "Nada a commitar."
            exit 0
          fi
          git commit -m "Chore: vendorizar as dependencias git upstream

          Gerado por .github/workflows/vendor-upstream-deps.yml. O build passa
          a ler essas fontes do proprio repositorio em vez de github.com/
          rustdesk-org. Cargo.toml e Cargo.lock ficam intactos: a troca e
          feita por source replacement em .cargo/config.toml, entao --locked
          continua valendo."
          git push origin HEAD:build-custom
